name: Bug report
description: Something looks wrong on a phone
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A phone screenshot helps more than a paragraph.
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, iOS 18, installed PWA (or Safari tab)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: DSH version and the plugin version from the style tag
      placeholder: dsh 0.2.1-rc.5, plugin 0.6.2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what happened instead
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output (optional)
      description: Open the browser console (or the Web Inspector on a connected iPhone) and paste anything red from the page
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag a phone screenshot here
